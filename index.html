<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversário Amor!</title>

    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>

<body>

    <!-- HEADER -->
    <header class="cabecalho">
        <div class="logo">
            <img src="Images/Sofialogo.png" alt="Logo" width="50">
        </div>

    <nav class="menu">
    <a href="https://www.youtube.com/watch?v=KS_TrJOQB-g" target="_blank">
        Início
    </a>

    <a href="https://www.youtube.com/watch?v=6SiTeQzFNY0" target="_blank">
        Séries
    </a>

    <a href="https://www.youtube.com/watch?v=PWqEPKduGm8" target="_blank">
        Filmes
    </a>

    <a href="https://www.youtube.com/watch?v=z0eQ22PwBH8" target="_blank">
        Lista
    </a>
</nav>



    </header>

    <!-- BANNER -->
    <section class="banner">
        <div class="conteudo">
            <p class="titulo">Sofia e Mateus</p>

            <div class="detalhes">
                <span>27 DE MARÇO, 1 TEMP EP 7</span>
                <span class="stars">
                    <i class="fa-solid fa-star" style="color:#ff0000;"></i>
                    <i class="fa-solid fa-star" style="color:#ff0000;"></i>
                    <i class="fa-solid fa-star" style="color:#ff0000;"></i>
                    <i class="fa-solid fa-star" style="color:#ff0000;"></i>
                    <i class="fa-solid fa-star" style="color:#ff0000;"></i>
                </span>
            </div>

            <p class="descricao">
                19 ANOS DO MEU AMOR ❤️<br>
                Feliz aniversário meu amor! Eu te amo muito minha princesa ❤️
                Te desejo as melhores coisas que esse mundo pode oferecer!! 
                Você é incrível.
            </p>

            <div class="botoes">
                <button><i class="fa-solid fa-play"></i> Continuar</button>
                <button><i class="fa-solid fa-star"></i> Favorito</button>
            </div>
        </div>
    </section>

    <!-- PRIMEIRA GALERIA -->
    <section class="momentos">
        <h2>Minha Princesa ❤️</h2>

        <div class="swiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="Images/1.jpeg"></div>
                <div class="swiper-slide"><img src="Images/2.jpeg"></div>
                <div class="swiper-slide"><img src="Images/3.jpeg"></div>
                <div class="swiper-slide"><img src="Images/4.jpeg"></div>
                <div class="swiper-slide"><img src="Images/5.jpeg"></div>
                <div class="swiper-slide"><img src="Images/6.jpeg"></div>
                <div class="swiper-slide"><img src="Images/7.jpeg"></div>
                <div class="swiper-slide"><img src="Images/8.jpeg"></div>
                <div class="swiper-slide"><img src="Images/9.jpeg"></div>
                <div class="swiper-slide"><img src="Images/10.jpeg"></div>
            </div>
        </div>
    </section>

    <!-- SEGUNDA GALERIA -->
    <section class="momentos">
        <h2>Nossos Momentinhos ❤️</h2>

        <div class="swiper">
            <div class="swiper-wrapper">

                <!-- Imagens -->
                <div class="swiper-slide"><img src="Images/11.jpeg"></div>
                <div class="swiper-slide"><img src="Images/12.jpeg"></div>
                <div class="swiper-slide"><img src="Images/13.jpeg"></div>
                <div class="swiper-slide"><img src="Images/14.jpeg"></div>
                <div class="swiper-slide"><img src="Images/15.jpeg"></div>
                <div class="swiper-slide"><img src="Images/16.jpeg"></div>
                <div class="swiper-slide"><img src="Images/17.jpeg"></div>
                <div class="swiper-slide"><img src="Images/18.jpeg"></div>
                <div class="swiper-slide"><img src="Images/19.jpeg"></div>
                <div class="swiper-slide"><img src="Images/20.jpeg"></div>
                <div class="swiper-slide"><img src="Images/21.jpeg"></div>
                <div class="swiper-slide"><img src="Images/22.jpeg"></div>
                <div class="swiper-slide"><img src="Images/23.jpeg"></div>
                <div class="swiper-slide"><img src="Images/24.jpeg"></div>
                <div class="swiper-slide"><img src="Images/25.jpeg"></div>

                <!-- Vídeos -->
                <div class="swiper-slide">
                    <video autoplay muted loop playsinline>
                        <source src="Videos/v1.mp4" type="video/mp4">
                    </video>
                </div>

                <div class="swiper-slide">
                    <video autoplay muted loop playsinline>
                        <source src="Videos/v2.mp4" type="video/mp4">
                    </video>
                </div>

                <div class="swiper-slide">
                    <video autoplay muted loop playsinline>
                        <source src="Videos/v3.mp4" type="video/mp4">
                    </video>
                </div>

                <div class="swiper-slide">
                    <video autoplay muted loop playsinline>
                        <source src="Videos/v4.mp4" type="video/mp4">
                    </video>
                </div>

                <div class="swiper-slide">
                    <video autoplay muted loop playsinline>
                        <source src="Videos/v5.mp4" type="video/mp4">
                    </video>
                </div>

            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        DE 2025 PARA SEMPRE! ❤️
    </footer>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        const swiper = new Swiper('.swiper', {
            loop: true,
            autoplay: {
                delay: 2500,
                disableOnInteraction: false,
            },
            slidesPerView: 2,
            spaceBetween: 10,
            breakpoints: {
                600: {
                    slidesPerView: 3,
                    spaceBetween: 15,
                },
                900: {
                    slidesPerView: 4,
                    spaceBetween: 40,
                }
            }
        });
    </script>

</body>
</html>
